<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Saver</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Tab Saver</h1>
        <button id="settingsButton" class="settings-button" title="Settings">
          <img src="icons/settings.png" alt="Settings" width="24" height="24">
        </button>
      </header>
      <main>
        <div class="search-bar">
          <input type="text" id="search" placeholder="Search saved tabs..." />
        </div>
        <div class="sort-filter-row">
          <div class="sort-filter-section">
            <label for="sortBy">Sort:</label>
            <select id="sortBy">
              <option value="date-desc">Newest First</option>
              <option value="date-asc">Oldest First</option>
              <option value="title-asc">Title (A-Z)</option>
              <option value="title-desc">Title (Z-A)</option>
            </select>
          </div>
          <div class="sort-filter-section">
            <label for="dateFilter">Saved:</label>
            <select id="dateFilter">
              <option value="all">All Time</option>
            </select>
          </div>
        </div>
        <div class="save-category-section">
          <label for="saveCategory">Save to Category:</label>
          <select id="saveCategory"></select>
        </div>
        <div class="actions">
          <button id="saveTab" class="btn btn-primary">Save Current Tab</button>
          <button id="saveAllTabs" class="btn btn-secondary">
            Save All Tabs
          </button>
        </div>
        <div class="filter-section">
          <label for="category">Filter by Category:</label>
          <select id="category"></select>
        </div>
        <div id="savedTabs">
          <div class="saved-tabs-header">
            <h2>Saved Tabs</h2>
            <button id="collapseAllBtn" class="collapse-all-btn" title="Collapse all categories">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="18 15 12 9 6 15"></polyline>
              </svg>
              <span id="collapseAllText">Collapse All</span>
            </button>
          </div>
          <p id="noTabsMessage" class="hidden">No saved tabs</p>
          <ul id="tabList"></ul>
        </div>
      </main>
    </div>
    <!-- Floating open selected button -->
    <div id="floatingOpenSelected" class="floating-open-selected hidden">
      <button id="openSelectedBtn" class="btn-floating-open">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/>
        </svg>
        <span id="openSelectedText">Open Selected (<span id="openSelectedCount">0</span>)</span>
      </button>
    </div>
    <!-- Toast notification -->
    <div id="toast" class="toast hidden"></div>
    <script src="popup.js"></script>
  </body>
</html>
